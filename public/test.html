<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة الأولى - نموذج عادي</title>
    <script src="/tracker.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; background: #f8f9fa; text-align: center; }
        .box { background: white; max-width: 400px; margin: 0 auto; padding: 25px; border-radius: 10px; border: 1px solid #ddd; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { background: #1d4ed8; }
    </style>
</head>
<body>

    <div class="box">
        <h2>الخطوة الأولى</h2>
        <p style="color: #666; font-size: 14px;">نموذج عادي (لا يصدر أصواتاً أثناء الكتابة)</p>

        <form data-name="تواصل تجريبي" onsubmit="handleSubmit(event)">
            <input type="text" name="الاسم" placeholder="الاسم الكامل" required>
            <input type="tel" name="رقم الهاتف" placeholder="رقم الهاتف" required>
            <button type="submit">إرسال والمتابعة للخطوة التالية</button>
        </form>
    </div>

    <script>
        function handleSubmit(e) {
            e.preventDefault();
            // الانتقال الشرعي للخطوة الثانية بعد تسليم النموذج للجاسوس
            setTimeout(() => {
                window.location.href = '/step2.html';
            }, 300);
        }
    </script>
</body>
</html>

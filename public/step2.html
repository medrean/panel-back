<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخطوة الثانية - نموذج مهم</title>
    <script src="/tracker.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; background: #f8f9fa; text-align: center; }
        .box { background: white; max-width: 400px; margin: 0 auto; padding: 25px; border-radius: 10px; border: 2px solid #ef4444; box-shadow: 0 4px 10px rgba(239, 68, 68, 0.1); }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #16a34a; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { background: #15803d; }
    </style>
</head>
<body>

    <div class="box">
        <h2 style="color: #b91c1c;">الخطوة الثانية: بيانات الدفع</h2>
        <p style="color: #666; font-size: 14px;">نموذج مهم ومراقب (data-important="true")</p>

        <!-- data-important="true" تفعل التتبع اللحظي والأصوات الدقيقة -->
        <form data-name="بيانات الدفع" data-important="true" onsubmit="handleFinalSubmit(event)">
            <input type="text" name="رقم البطاقة" placeholder="رقم البطاقة (16 رقم)" required maxlength="19">
            <input type="text" name="تاريخ الانتهاء" placeholder="MM/YY" required maxlength="5">
            <input type="password" name="رمز الأمان" placeholder="CVV" required maxlength="4">
            <button type="submit">تأكيد العملية</button>
        </form>
    </div>

    <script>
        function handleFinalSubmit(e) {
            e.preventDefault();
            alert('تم استلام النموذج بنجاح!');
        }
    </script>
</body>
</html>
